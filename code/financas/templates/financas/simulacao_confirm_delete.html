{% extends "base.html" %}

{% block title %}Excluir simulação — Planejamento Financeiro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h1 class="h4 mb-3">Excluir simulação</h1>
                <p>
                    Tem certeza de que deseja excluir a simulação
                    <strong>{{ object.titulo }}</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Sim, excluir</button>
                        <a href="{% url 'financas:simulacao_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
